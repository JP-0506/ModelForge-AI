services:

  django:
    build:
      context: ./django_backend
      dockerfile: Dockerfile

    container_name: modelforge-django
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ./django_backend/media:/app/media

    environment:
      SECRET_KEY: django-insecure-your-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,django"

      HOST: "0.0.0.0"
      PORT: "8000"

      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5000"

      NODE_API_URL: "http://node:5000"

      MEDIA_ROOT: "media"
      MEDIA_URL: "/media/"

      MAX_UPLOAD_SIZE: "104857600"
      ALLOWED_DATASET_EXTENSIONS: "csv,xlsx,xls,json"

      MODEL_PATH: "media/models/"
      REPORT_PATH: "media/reports/"
      TEMP_PATH: "media/temp/"

      LOG_LEVEL: "INFO"
      RANDOM_STATE: "42"

  node:
    build:
      context: ./node_backend
      dockerfile: Dockerfile

    container_name: modelforge-node
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: development
      PORT: 5000

      MONGODB_URI: mongodb://host.docker.internal:27017/ModelForge-AI

      DJANGO_API_URL: http://django:8000/api/ml
      DJANGO_MEDIA_PATH: /app/media

      JWT_SECRET: your_jwt_secret
      JWT_EXPIRES_IN: 7d

      FRONTEND_URL: http://localhost:5173

      UPLOAD_PATH: src/uploads
      MAX_FILE_SIZE: 104857600

      LOG_LEVEL: info

      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: "modelforge0108@gmail.com"
      EMAIL_PASSWORD: "tics xjml ssjo ixvo"

    depends_on:
      - django

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: modelforge-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      VITE_API_BASE_URL: http://localhost:5000/
      VITE_ML_ENGINE_URL: http://localhost:8000/

    depends_on:
      - node